[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev"
version = "0.0.1"
description = "Multi-Agent Profile orchestrator — Git/filesystem SDD loop (v0 walking skeleton)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "fun-mxy" }]
dependencies = [
    "pyyaml>=6.0",
]

# Dev tooling lives in a PEP 735 dependency group so `uv sync` installs it
# automatically (no `--extra dev` needed). These are not runtime dependencies.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
# Console entry: `ai-dev create-feature-run "<intent>"`
ai-dev = "ai_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src layout: let tests import the package without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage is on by default (`uv run pytest` prints it). Branch coverage is
# tracked but there is NO `--cov-fail-under` gate — the number is a soft target
# (see README), not a build-breaking threshold. Drop to HTML with:
#   uv run pytest --cov-report=html
addopts = "-ra --cov=ai_dev --cov-branch --cov-report=term-missing"

[tool.mypy]
packages = ["ai_dev"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
# Keep the v0 skeleton honest without forcing heavy annotations everywhere yet.
disallow_untyped_defs = true
